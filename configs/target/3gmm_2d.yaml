name: gmm
spatial_dim: 2
n_bits: 8
translate: 50.0
scale: 100.0
n_centres: 3
variance: 10.0

# ----- Select model for this target ----- #
defaults:
  - /model: mlp_2layers

# ----- Target-specific algorithm cfg ----- #
all:
  n_epochs: 2000
  n_eval_samples: 2048
  n_final_eval_samples: 16384

mdns:
  n_epochs: 5000
  use_anneal: false  # not used by default, instead we set invtemp_min=0.0

mcmc:
  name: hamming_ball
  L: 5
